<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Risk Register | ISI Practice Bench</title>
  <link rel="stylesheet" href="/internal/css/practice.css">
</head>
<body>
  <main class="pr-wrap">
    <p class="pr-kicker">Probability × impact · EMV</p>
    <h1>Risk assessment</h1>
    <p class="lede">Quantifies uncertainty in cost, schedule, and capital decisions. EMV = probability × impact. Heatmap is P × I. Placeholders — replace descriptions and dollars in the room.</p>
    <div class="pr-panel">
      <table class="pr-table" id="tbl"></table>
      <div class="pr-actions"><button class="btn btn-gold" id="recalc" type="button">Recalculate EMV</button></div>
    </div>
    <div class="pr-metrics" id="metrics"></div>
    <div class="pr-panel"><h2>Heatmap (impact × probability buckets)</h2><canvas id="heat" class="chart"></canvas></div>
  </main>
  <script src="/internal/js/store.js"></script>
  <script src="/internal/js/math.js"></script>
  <script src="/internal/js/charts.js"></script>
  <script src="/internal/js/shell.js"></script>
  <script>
    ISI.shell.render("tools");
    var RISKS = [
      { name: "Tariff on imported coil", p: 0.35, impact: 420000, type: "cost" },
      { name: "Constraint overtime spike", p: 0.55, impact: 180000, type: "cost" },
      { name: "Commissioning slip 6 weeks", p: 0.4, impact: 260000, type: "schedule" },
      { name: "Key customer concentration", p: 0.25, impact: 900000, type: "revenue" },
      { name: "Single-source PCB", p: 0.3, impact: 310000, type: "supply" },
      { name: "Permit delay", p: 0.2, impact: 150000, type: "schedule" }
    ];
    function emv(r) { return r.p * r.impact; }
    function paint() {
      var html = "<thead><tr><th>Risk</th><th>P</th><th>Impact $</th><th>Type</th><th>EMV</th></tr></thead><tbody>";
      RISKS.forEach(function (r, i) {
        html += "<tr><td><input data-i='" + i + "' data-k='name' value='" + r.name + "'></td>" +
          "<td><input data-i='" + i + "' data-k='p' type='number' step='0.05' value='" + r.p + "'></td>" +
          "<td><input data-i='" + i + "' data-k='impact' type='number' value='" + r.impact + "'></td>" +
          "<td>" + r.type + "</td><td>" + ISI.shell.money(emv(r)) + "</td></tr>";
      });
      document.getElementById("tbl").innerHTML = html + "</tbody>";
      var total = ISI.math.sum(RISKS.map(emv));
      var top = RISKS.slice().sort(function (a, b) { return emv(b) - emv(a); })[0];
      document.getElementById("metrics").innerHTML =
        '<div class="pr-metric"><div class="lbl">Portfolio EMV</div><div class="val">' + ISI.shell.money(total) + "</div></div>" +
        '<div class="pr-metric"><div class="lbl">Largest EMV</div><div class="val">' + top.name + "</div></div>" +
        '<div class="pr-metric"><div class="lbl">Count</div><div class="val">' + RISKS.length + "</div></div>";
      var matrix = [[0,0,0],[0,0,0],[0,0,0]];
      RISKS.forEach(function (r) {
        var pi = r.p < 0.3 ? 0 : r.p < 0.5 ? 1 : 2;
        var ii = r.impact < 200000 ? 0 : r.impact < 400000 ? 1 : 2;
        matrix[2 - ii][pi] += 1;
      });
      ISI.charts.heatmap(document.getElementById("heat"), matrix, ["High impact", "Med impact", "Low impact"], ["Low P", "Med P", "High P"]);
    }
    paint();
    document.getElementById("tbl").addEventListener("change", function (e) {
      var t = e.target;
      var i = Number(t.getAttribute("data-i"));
      var k = t.getAttribute("data-k");
      if (k === "name") RISKS[i].name = t.value;
      else RISKS[i][k] = Number(t.value);
    });
    document.getElementById("recalc").addEventListener("click", function () {
      paint();
      ISI.store.saveResult("risk", { emv: ISI.math.sum(RISKS.map(emv)) });
    });
  </script>
</body>
</html>
